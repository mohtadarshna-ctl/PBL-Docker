name: Test, Build, and Push Docker Image

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Automated API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start FastAPI server and run automationTesting.py
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          SERVER_PID=$!
          for i in {1..15}; do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "Server is healthy"
              break
            fi
            sleep 1
          done
          python automationTesting.py
          kill $SERVER_PID || true

  build-and-push:
    name: Build and Push to Docker Hub
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Docker Hub secrets
        env:
          DOCKER_USER: ${{ secrets.DOCKERUSERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKERTOKEN }}
        run: |
          if [ -z "$DOCKER_USER" ] || [ -z "$DOCKER_PASS" ]; then
            echo "DOCKERUSERNAME or DOCKERTOKEN secret is not set. Skipping Docker Hub push."
            exit 0
          fi

      - name: Login to Docker Hub
        if: secrets.DOCKERUSERNAME != '' && secrets.DOCKERTOKEN != ''
        env:
          DOCKER_USER: ${{ secrets.DOCKERUSERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKERTOKEN }}
        run: |
          echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin

      - name: Build and push Docker image
        if: secrets.DOCKERUSERNAME != '' && secrets.DOCKERTOKEN != ''
        env:
          DOCKER_USER: ${{ secrets.DOCKERUSERNAME }}
        run: |
          docker build -t "$DOCKER_USER/pbl-docker-student-api:v0.1" -t "$DOCKER_USER/pbl-docker-student-api:latest" .
          docker push "$DOCKER_USER/pbl-docker-student-api:v0.1"
          docker push "$DOCKER_USER/pbl-docker-student-api:latest"
